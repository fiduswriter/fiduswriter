name: CI

on:
    push:
        branches:
            - main
            - develop
        paths-ignore:
            - 'docs/**'
            - '**.md'
            - 'LICENSE'
            - 'AUTHORS'
            - '.github/FUNDING.yml'
    pull_request:
        branches:
            - main
            - develop
        paths-ignore:
            - 'docs/**'
            - '**.md'
            - 'LICENSE'
            - 'AUTHORS'
            - '.github/FUNDING.yml'

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

env:
    # The Python/Django source lives in the fiduswriter-server-backend
    # repository; this repo only orchestrates CI.
    BACKEND_REPO: fiduswriter-server-backend

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v6
          with:
            python-version: "3.14"
        - name: Check out backend repository
          run: |
              git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/fiduswriter/${BACKEND_REPO}.git" "${BACKEND_REPO}" 2>/dev/null \
                  || git clone --depth 1 "https://github.com/fiduswriter/${BACKEND_REPO}.git" "${BACKEND_REPO}"
        - name: Run pre-commit
          working-directory: ${{ env.BACKEND_REPO }}
          run: |
              python -m pip install pre-commit
              pre-commit run --all-files
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                test:
                    - "browser_check base style"
                    - user
                    - feedback
                    - document.tests.test_collaboration
                    - document.tests.test_editor.EditorTest.test_crossrefs_and_internal_links
                    - document.tests.test_editor.EditorTest.test_share_document
                    - document.tests.test_editor.EditorTest.test_track_changes
                    - document.tests.test_offline
                    - document.tests.test_export
                    - "document.tests.test_admin document.tests.test_external_save"
                    #- document.tests.test_message_exchange
                    - document.tests.test_paste_template_filter
                    - document.tests.test_memory_leak
                    - document.tests.test_merge
                    - "document.tests.test_path document.tests.test_inline_editors"
                    - document.tests.test_share_link_access
                    - document.tests.test_e2ee
                    - "document.tests.test_views_unit document.tests.test_helpers"
                    - bibliography
                    - usermedia
                    - user_template_manager
        steps:
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 26
            - uses: actions/checkout@v7
            - uses: nanasess/setup-chromedriver@v3
            - name: Check out backend repository
              run: |
                  git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/fiduswriter/${BACKEND_REPO}.git" "${BACKEND_REPO}" 2>/dev/null \
                      || git clone --depth 1 "https://github.com/fiduswriter/${BACKEND_REPO}.git" "${BACKEND_REPO}"
            - name: Install dependencies
              run: |
                  sudo apt update
                  sudo apt install libjpeg-dev python3-dev python3-pip gettext zlib1g-dev git nodejs build-essential
                  cd ${{ env.BACKEND_REPO }}
                  mv ci/configuration.py fiduswriter/configuration.py
                  cd fiduswriter
                  pip install requests[security]
                  pip install -r requirements.txt
                  pip install -r test-requirements.txt
                  pip install orjson
                  pip install coverage
                  pip install coveralls
                  coverage run --concurrency=multiprocessing,thread manage.py setup --no-static
            - name: Set up Xvfb and ffmpeg
              if: runner.debug == '1'
              run: |
                sudo apt update
                sudo apt install -y xvfb ffmpeg
                # Start two Xvfb instances on different displays
                Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
                Xvfb :98 -screen 0 1920x1080x24 > /dev/null 2>&1 &
                # Set the default display (will be overridden in the test code)
                echo "DISPLAY=:99" >> $GITHUB_ENV
                # Start ffmpeg recordings for both displays
                ffmpeg -y -f x11grab -video_size 1920x1080 -framerate 15 -i :99 -codec:v libx264 -preset ultrafast video-browser1.mp4 > /dev/null 2>&1 &
                echo "FFMPEG_PID1=$!" >> $GITHUB_ENV
                ffmpeg -y -f x11grab -video_size 1920x1080 -framerate 15 -i :98 -codec:v libx264 -preset ultrafast video-browser2.mp4 > /dev/null 2>&1 &
                echo "FFMPEG_PID2=$!" >> $GITHUB_ENV
            - name: Run test ${{ matrix.test }} without debug mode
              if: runner.debug != '1'
              uses: nick-invision/retry@v4
              with:
                timeout_minutes: 10
                max_attempts: 3
                retry_on: error
                command: |
                  cd ${{ env.BACKEND_REPO }}/fiduswriter
                  coverage run --concurrency=multiprocessing,thread manage.py test ${{ matrix.test }} -v 2
            - name: Run test ${{ matrix.test }} with debug mode
              if: runner.debug == '1'
              run: |
                cd ${{ env.BACKEND_REPO }}/fiduswriter
                export DEBUG_MODE=1
                coverage run --concurrency=multiprocessing,thread manage.py test ${{ matrix.test }} -v 2 --debug-mode
            - name: Kill FFMPEG processes
              if: ${{ runner.debug == '1' && (failure() || success()) }}
              run: |
                  kill $FFMPEG_PID1 || true
                  kill $FFMPEG_PID2 || true
                  sleep 5  # Give ffmpeg time to finish writing
            - name: Upload video
              if: ${{ runner.debug == '1' && (failure() || success()) }}
              uses: actions/upload-artifact@v4
              with:
                name: test-video
                path: |
                  video-browser1.mp4
                  video-browser2.mp4
            - name: Upload failed test screenshots
              if: ${{ failure() }}
              uses: actions/upload-artifact@v4.3.4
              with:
                name: failure-artifacts
                path: ${{ github.workspace }}/${{ env.BACKEND_REPO }}/fiduswriter/screenshots/
            - name: Coveralls
              run: |
                cd ${{ env.BACKEND_REPO }}/fiduswriter
                coverage combine
                for attempt in 1 2 3; do
                  coveralls --service=github && break
                  echo "Coveralls upload failed (attempt $attempt), retrying in 30s..."
                  sleep 30
                done
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                COVERALLS_PARALLEL: true
                COVERALLS_FLAG_NAME: ${{ matrix.test }}
    plugin-tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - test: "book.tests.test_book book.tests.test_book_e2ee book.tests.test_book_native book.tests.test_book_template_save"
                      repos: "fiduswriter-books-plugin"
                      apps: '"book"'
                    - test: "pandoc.tests.test_pandoc pandoc.tests.test_book"
                      repos: "fiduswriter-pandoc-plugin fiduswriter-books-plugin"
                      apps: '"pandoc", "book"'
                    - test: "citation_api_import.tests.test_citation_api_import"
                      repos: "fiduswriter-citation-api-import-plugin"
                      apps: '"citation_api_import"'
                    - test: "gitrepo_export.tests.test_gitrepo_export"
                      repos: "fiduswriter-gitrepo-export-plugin"
                      apps: '"gitrepo_export"'
                    - test: "languagetool.tests.test_languagetool"
                      repos: "fiduswriter-languagetool-plugin"
                      apps: '"languagetool"'
                    - test: "llm.tests.test_llm"
                      repos: "fiduswriter-llm-plugin"
                      apps: '"llm"'
                    - test: "ojs.tests.test_ojs"
                      repos: "fiduswriter-ojs-plugin"
                      apps: '"ojs"'
                    - test: "payment.tests.test_payment"
                      repos: "fiduswriter-payment-plugin"
                      apps: '"payment"'
                    - test: "phplist.tests.test_phplist"
                      repos: "fiduswriter-phplist-plugin"
                      apps: '"phplist"'
        steps:
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 26
            - uses: actions/checkout@v7
            - uses: nanasess/setup-chromedriver@v3
            - name: Check out backend repository
              run: |
                  git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/fiduswriter/${BACKEND_REPO}.git" "${BACKEND_REPO}" 2>/dev/null \
                      || git clone --depth 1 "https://github.com/fiduswriter/${BACKEND_REPO}.git" "${BACKEND_REPO}"
            - name: Check out plugin repositories
              run: |
                  for repo in ${{ matrix.repos }}; do
                      git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/fiduswriter/${repo}.git" "${repo}" 2>/dev/null \
                          || git clone --depth 1 "https://github.com/fiduswriter/${repo}.git" "${repo}"
                  done
            - name: Symlink plugin apps into the main app
              run: |
                  read -ra repo_arr <<< "${{ matrix.repos }}"
                  read -ra app_arr <<< "$(echo ${{ matrix.apps }} | tr -d '",')"
                  for i in "${!repo_arr[@]}"; do
                      repo="${repo_arr[$i]}"
                      app="${app_arr[$i]}"
                      ln -s "../../${repo}/fiduswriter/${app}" "${{ env.BACKEND_REPO }}/fiduswriter/${app}"
                  done
            - name: Install dependencies
              run: |
                  sudo apt update
                  sudo apt install libjpeg-dev python3-dev python3-pip gettext zlib1g-dev git nodejs build-essential
                  cd ${{ env.BACKEND_REPO }}/fiduswriter
                  cat > configuration.py <<EOF
                  INSTALLED_APPS = [
                      "user_template_manager",
                      ${{ matrix.apps }}
                  ]

                  # Disable axes for testing to reduce console output and avoid lockout issues
                  REMOVED_APPS = [
                      "axes",
                  ]

                  STORAGES = {
                      "default": {"BACKEND": "django.core.files.storage.FileSystemStorage"},
                      "staticfiles": {
                          "BACKEND": "django.contrib.staticfiles.storage.StaticFilesStorage"
                      },
                  }
                  EOF
                  pip install requests[security]
                  pip install -r requirements.txt
                  pip install -r test-requirements.txt
                  pip install orjson
                  coverage run --concurrency=multiprocessing,thread manage.py setup --no-static
            - name: Run plugin test ${{ matrix.test }}
              uses: nick-invision/retry@v4
              with:
                timeout_minutes: 10
                max_attempts: 3
                retry_on: error
                command: |
                  cd ${{ env.BACKEND_REPO }}/fiduswriter
                  coverage run --concurrency=multiprocessing,thread manage.py test ${{ matrix.test }} -v 2
            - name: Upload failed test screenshots
              if: ${{ failure() }}
              uses: actions/upload-artifact@v4.3.4
              with:
                name: failure-artifacts
                path: ${{ github.workspace }}/${{ env.BACKEND_REPO }}/fiduswriter/screenshots/
    finish:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Coveralls Finished
              run: curl "https://coveralls.io/webhook?repo_token=${{ secrets.GITHUB_TOKEN }}&repo_name=${{ github.repository }}" -d "payload[build_num]=${{ github.run_id }}&payload[status]=done"
