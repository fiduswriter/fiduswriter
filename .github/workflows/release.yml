name: Release

on:
    push:
        tags:
            - '*'

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Opt into Node.js 24 early for JavaScript-based actions.
# This suppresses deprecation warnings for actions still on Node.js 20.
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build-deb:
        name: Build Debian Package (${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runs-on: ubuntu-latest
                    - arch: arm64
                      runs-on: ubuntu-24.04-arm
        runs-on: ${{ matrix.runs-on }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cache Python build
              uses: actions/cache@v5
              with:
                  path: .python-build-cache
                  key: python-build-${{ matrix.arch }}-${{ hashFiles('debian/rules') }}
                  restore-keys: |
                      python-build-${{ matrix.arch }}-

            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential debhelper dh-python dh-virtualenv \
                    python3 python3-setuptools python3-babel python3-wheel python3-pip \
                    libssl-dev libffi-dev libbz2-dev libreadline-dev \
                    libsqlite3-dev libncurses-dev libncursesw5-dev \
                    xz-utils tk-dev liblzma-dev libjpeg-dev zlib1g-dev \
                    libmagic1 wget curl devscripts equivs

            # build-deb.sh stages this checkout together with debian/ into a
            # scratch tree; clone at the release tag (falling back to main)
            # like the PyPI/Docker jobs do.
            - name: Check out backend repository
              run: |
                  git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend 2>/dev/null \
                      || git clone --depth 1 "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend

            - name: Build Debian package
              run: ./build-deb.sh

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: debian-package-${{ matrix.arch }}
                  path: debian-build/*.deb

    build-desktop-linux:
        name: Build Desktop (Linux, ${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x86_64
                      runs-on: ubuntu-22.04
                    - arch: aarch64
                      runs-on: ubuntu-24.04-arm
        runs-on: ${{ matrix.runs-on }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # The desktop application lives in its own repository next to the
            # backend, so the build clones it at the same ref.
            # Cloned from the canonical Forgejo host rather than with
            # actions/checkout: the desktop repository has no GitHub mirror, and
            # git.fiduswriter.org is where the source of truth lives. This also
            # keeps the desktop build working if the mirror lags behind.
            #
            # When this run is for a tag, build *that tag* if the desktop
            # repository has it, so the binaries correspond to the tagged source
            # rather than to whatever main happens to be. Falls back to main,
            # because a desktop tag may legitimately lag a server tag.
            - name: Checkout desktop application
              run: |
                  mkdir -p fiduswriter-desktop
                  git clone \
                    "https://git.fiduswriter.org/fiduswriter/fiduswriter-desktop.git" \
                    fiduswriter-desktop
                  cd fiduswriter-desktop
                  REF="${{ github.ref_type }}"
                  if [ "$REF" = "tag" ]; then
                      TAG="${{ github.ref_name }}"
                      if git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"; then
                          git checkout "$TAG"
                          echo "Building desktop application at tag $TAG"
                      else
                          echo "::warning::Desktop repository has no tag $TAG; building main."
                      fi
                  else
                      git checkout "${{ github.ref_name || 'main' }}"
                  fi
                  git log -1 --format='Desktop source: %H %s'

            # version.sh reads fiduswriter/version.txt from the backend
            # checkout, so the desktop artifacts carry the same version as the
            # server release.
            - name: Check out backend repository
              run: |
                  git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend 2>/dev/null \
                      || git clone --depth 1 "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: fiduswriter-desktop/src-tauri -> target
                  key: desktop-linux-${{ matrix.arch }}

            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential curl wget file pkg-config \
                    libwebkit2gtk-4.1-dev \
                    libgtk-3-dev libayatana-appindicator3-dev \
                    librsvg2-dev libssl-dev libxdo-dev \
                    desktop-file-utils rpm

            # The desktop application builds with pnpm (see its
            # packageManager field); neither the ubuntu-22.04 nor the arm
            # runners ship it.
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 26

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: fiduswriter-desktop/package.json

            # scripts/build.js resolves fiduswriter-file-types as a sibling of
            # the fiduswriter-desktop checkout (it owns the artwork and the
            # file type declarations; it is not on npm).
            - name: Check out file type definitions
              run: |
                  git clone --depth 1 --branch "${{ github.ref_name }}" "https://git.fiduswriter.org/fiduswriter/fiduswriter-file-types.git" fiduswriter-file-types 2>/dev/null \
                      || git clone --depth 1 "https://git.fiduswriter.org/fiduswriter/fiduswriter-file-types.git" fiduswriter-file-types

            # Ubuntu 22.04 is the oldest supported baseline: it provides
            # libwebkit2gtk-4.1-dev, which Tauri 2 requires. Building on the
            # oldest supported system keeps the AppImage portable.
            - name: Build AppImage and deb
              run: |
                  ./desktop/linux/build-linux.sh --appimage --deb
              env:
                  FIDUSWRITER_BACKEND_DIR: ${{ github.workspace }}/fiduswriter-server-backend
                  FIDUSWRITER_DESKTOP_DIR: ${{ github.workspace }}/fiduswriter-desktop

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: desktop-linux-${{ matrix.arch }}
                  path: desktop-build/*

    build-desktop-macos:
        name: Build Desktop (macOS)
        # Declared at job level so the signing steps' `if` can test whether the
        # credential exists. A step's own `env:` block is not visible to its own
        # `if`, so secrets cannot be tested for directly.
        env:
            MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: aarch64
                      runs-on: macos-15
                    - arch: x86_64
                      runs-on: macos-13
        runs-on: ${{ matrix.runs-on }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # Cloned from the canonical Forgejo host rather than with
            # actions/checkout: the desktop repository has no GitHub mirror, and
            # git.fiduswriter.org is where the source of truth lives. This also
            # keeps the desktop build working if the mirror lags behind.
            #
            # When this run is for a tag, build *that tag* if the desktop
            # repository has it, so the binaries correspond to the tagged source
            # rather than to whatever main happens to be. Falls back to main,
            # because a desktop tag may legitimately lag a server tag.
            - name: Checkout desktop application
              run: |
                  mkdir -p fiduswriter-desktop
                  git clone \
                    "https://git.fiduswriter.org/fiduswriter/fiduswriter-desktop.git" \
                    fiduswriter-desktop
                  cd fiduswriter-desktop
                  REF="${{ github.ref_type }}"
                  if [ "$REF" = "tag" ]; then
                      TAG="${{ github.ref_name }}"
                      if git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"; then
                          git checkout "$TAG"
                          echo "Building desktop application at tag $TAG"
                      else
                          echo "::warning::Desktop repository has no tag $TAG; building main."
                      fi
                  else
                      git checkout "${{ github.ref_name || 'main' }}"
                  fi
                  git log -1 --format='Desktop source: %H %s'

            # version.sh reads fiduswriter/version.txt from the backend
            # checkout, so the desktop artifacts carry the same version as the
            # server release.
            - name: Check out backend repository
              run: |
                  git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend 2>/dev/null \
                      || git clone --depth 1 "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend

            # scripts/build.js resolves fiduswriter-file-types as a sibling of
            # the fiduswriter-desktop checkout (it owns the artwork and the
            # file type declarations; it is not on npm), and build-macos.sh
            # reads it via FIDUSWRITER_FILE_TYPES_DIR below.
            - name: Check out file type definitions
              run: |
                  git clone --depth 1 --branch "${{ github.ref_name }}" "https://git.fiduswriter.org/fiduswriter/fiduswriter-file-types.git" fiduswriter-file-types 2>/dev/null \
                      || git clone --depth 1 "https://git.fiduswriter.org/fiduswriter/fiduswriter-file-types.git" fiduswriter-file-types

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: fiduswriter-desktop/src-tauri -> target
                  key: desktop-macos-${{ matrix.arch }}

            # The desktop application builds with pnpm (see its
            # packageManager field).
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 26

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: fiduswriter-desktop/package.json

            # The Linux build script runs this itself; the direct tauri
            # invocations here need the dependencies installed first, or
            # `pnpm run tauri build` cannot find the tauri binary.
            - name: Install desktop dependencies
              run: pnpm install --frozen-lockfile
              working-directory: fiduswriter-desktop

            - name: Build unsigned bundle
              run: pnpm run tauri build --bundles app
              working-directory: fiduswriter-desktop

            - name: Merge file type declarations and create dmg
              run: ./desktop/macos/build-macos.sh
              env:
                  FIDUSWRITER_BACKEND_DIR: ${{ github.workspace }}/fiduswriter-server-backend
                  FIDUSWRITER_DESKTOP_DIR: ${{ github.workspace }}/fiduswriter-desktop
                  FIDUSWRITER_FILE_TYPES_DIR: ${{ github.workspace }}/fiduswriter-file-types

            # Signing credentials are optional, so forks and manual runs still
            # produce an artifact; without them the bundle ships unsigned and
            # Gatekeeper will warn about it.
            #
            # The certificate has to be imported into a keychain first: a hosted
            # runner has no Developer ID identity, so `codesign` would fail with
            # "no identity found" even with SIGNING_IDENTITY set.
            - name: Import signing certificate
              if: ${{ env.MACOS_CERTIFICATE != '' }}
              env:
                  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
              run: |
                  echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
                  security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
                  security default-keychain -s build.keychain
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD"
                  security import /tmp/cert.p12 \
                      -k build.keychain \
                      -P "$KEYCHAIN_PASSWORD" \
                      -T /usr/bin/codesign -T /usr/bin/security
                  # Allow codesign to use the key without an interactive prompt.
                  security set-key-partition-list \
                      -S apple-tool:,apple:,codesign: \
                      -s -k "$KEYCHAIN_PASSWORD" build.keychain
                  rm -f /tmp/cert.p12

            - name: Sign and notarize
              if: ${{ env.MACOS_CERTIFICATE != '' }}
              run: ./desktop/macos/build-macos.sh --sign
              env:
                  SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
                  NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
                  NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
                  FIDUSWRITER_BACKEND_DIR: ${{ github.workspace }}/fiduswriter-server-backend
                  FIDUSWRITER_DESKTOP_DIR: ${{ github.workspace }}/fiduswriter-desktop
                  FIDUSWRITER_FILE_TYPES_DIR: ${{ github.workspace }}/fiduswriter-file-types

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: desktop-macos-${{ matrix.arch }}
                  path: desktop-build/*.dmg

    build-desktop-windows:
        name: Build Desktop (Windows)
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # Cloned from the canonical Forgejo host rather than with
            # actions/checkout: the desktop repository has no GitHub mirror, and
            # git.fiduswriter.org is where the source of truth lives. This also
            # keeps the desktop build working if the mirror lags behind.
            #
            # When this run is for a tag, build *that tag* if the desktop
            # repository has it, so the binaries correspond to the tagged source
            # rather than to whatever main happens to be. Falls back to main,
            # because a desktop tag may legitimately lag a server tag.
            - name: Checkout desktop application
              run: |
                  mkdir -p fiduswriter-desktop
                  git clone \
                    "https://git.fiduswriter.org/fiduswriter/fiduswriter-desktop.git" \
                    fiduswriter-desktop
                  cd fiduswriter-desktop
                  REF="${{ github.ref_type }}"
                  if [ "$REF" = "tag" ]; then
                      TAG="${{ github.ref_name }}"
                      if git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"; then
                          git checkout "$TAG"
                          echo "Building desktop application at tag $TAG"
                      else
                          echo "::warning::Desktop repository has no tag $TAG; building main."
                      fi
                  else
                      git checkout "${{ github.ref_name || 'main' }}"
                  fi
                  git log -1 --format='Desktop source: %H %s'
              # The clone uses bash continuations; the windows runner defaults
              # to pwsh, which cannot parse them.
              shell: bash

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: fiduswriter-desktop/src-tauri -> target
                  key: desktop-windows-x64

            # The desktop application builds with pnpm (see its
            # packageManager field).
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: 26

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: fiduswriter-desktop/package.json

            # scripts/build.js resolves fiduswriter-file-types as a sibling of
            # the fiduswriter-desktop checkout (it owns the artwork and the
            # file type declarations; it is not on npm).
            - name: Check out file type definitions
              run: |
                  git clone --depth 1 --branch "${{ github.ref_name }}" "https://git.fiduswriter.org/fiduswriter/fiduswriter-file-types.git" fiduswriter-file-types 2>/dev/null \
                      || git clone --depth 1 "https://git.fiduswriter.org/fiduswriter/fiduswriter-file-types.git" fiduswriter-file-types
              shell: bash

            # The Linux build script runs this itself; the direct tauri
            # invocation here needs the dependencies installed first, or
            # `pnpm run tauri build` cannot find the tauri binary.
            - name: Install desktop dependencies
              run: pnpm install --frozen-lockfile
              working-directory: fiduswriter-desktop

            # Tauri's own NSIS bundler produces the installer; the extra
            # Inno Setup script in desktop/windows/ registers the Fidus file
            # types, which Tauri's NSIS target does not do.
            - name: Build NSIS installer
              run: pnpm run tauri build --bundles nsis
              working-directory: fiduswriter-desktop

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: desktop-windows-x64
                  path: fiduswriter-desktop/src-tauri/target/release/bundle/nsis/*.exe

    build-rpm:
        name: Build RPM Package (${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x86_64
                      runs-on: ubuntu-latest
                    - arch: aarch64
                      runs-on: ubuntu-24.04-arm
        runs-on: ${{ matrix.runs-on }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cache Python build
              uses: actions/cache@v5
              with:
                  path: .python-build-cache
                  key: rpm-python-build-${{ matrix.arch }}-${{ hashFiles('rpm/fiduswriter-server.spec') }}
                  restore-keys: |
                      rpm-python-build-${{ matrix.arch }}-

            # build-rpm.sh stages this checkout together with rpm/ and debian/
            # into a scratch tree; clone at the release tag (falling back to
            # main).
            - name: Check out backend repository
              run: |
                  git clone --depth 1 --branch "${{ github.ref_name }}" "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend 2>/dev/null \
                      || git clone --depth 1 "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend

            - name: Build RPM in Rocky Linux container
              run: |
                  docker run --rm \
                    -v $(pwd):/src \
                    -w /src \
                    rockylinux:9 \
                    bash -c "
                      set -e
                      dnf install -y epel-release
                      dnf config-manager --set-enabled crb 2>/dev/null || dnf config-manager --set-enabled powertools 2>/dev/null || true
                      dnf install -y rpm-build gcc make wget git \
                        openssl-devel libffi-devel bzip2-devel readline-devel \
                        sqlite-devel ncurses-devel xz-devel tk-devel \
                        zlib-devel libjpeg-turbo-devel mariadb-devel \
                        python3 python3-pip python3-setuptools \
                        systemd-rpm-macros
                      ./build-rpm.sh
                    "

            - name: Fix permissions
              run: sudo chown -R $(id -u):$(id -g) .

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: rpm-package-${{ matrix.arch }}
                  path: rpm-build/*.rpm

    build-pypi:
        name: Build PyPI Package
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Check out backend repository
              run: |
                  git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend 2>/dev/null \
                      || git clone --depth 1 "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.14'

            - name: Install build tools
              run: pip install build

            - name: Build package
              working-directory: fiduswriter-server-backend
              run: python -m build

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: pypi-package
                  path: fiduswriter-server-backend/dist/*

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}
                  skip-existing: true
                  attestations: false
                  packages-dir: fiduswriter-server-backend/dist/

    build-docker:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: []
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Check out backend repository
              run: |
                  git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend 2>/dev/null \
                      || git clone --depth 1 "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend

            - name: Determine version
              id: version
              run: |
                  VERSION=$(tr -d '[:space:]' < fiduswriter-server-backend/fiduswriter/version.txt)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Building version: $VERSION"
                  IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
                  echo "major=$MAJOR" >> $GITHUB_OUTPUT
                  echo "minor=$MINOR" >> $GITHUB_OUTPUT

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Check Docker Hub secrets
              id: dockerhub
              env:
                  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
              run: |
                  if [ -n "$DOCKER_USERNAME" ]; then
                    echo "available=true" >> $GITHUB_OUTPUT
                  else
                    echo "available=false" >> $GITHUB_OUTPUT
                  fi

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Log in to Docker Hub
              if: steps.dockerhub.outputs.available == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Generate image list
              id: images
              env:
                  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
              run: |
                  IMAGES="ghcr.io/${{ github.repository_owner }}/fiduswriter"
                  if [ -n "$DOCKER_USERNAME" ]; then
                    IMAGES="$IMAGES"$'\n'"fiduswriter/fiduswriter"
                  fi
                  echo "list<<EOF" >> $GITHUB_OUTPUT
                  echo "$IMAGES" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.images.outputs.list }}
                  tags: |
                    # Floating tags (latest, major, major.minor) only move for
                    # stable releases — pre-release tags get the exact version
                    # tag only.
                    type=raw,value=latest,enable=${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'RC') && !contains(github.ref_name, 'dev') }}
                    type=raw,value=${{ steps.version.outputs.version }}
                    type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }},enable=${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'RC') && !contains(github.ref_name, 'dev') }}
                    type=raw,value=${{ steps.version.outputs.major }},enable=${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'RC') && !contains(github.ref_name, 'dev') }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                    FIDUSWRITER_VERSION=${{ steps.version.outputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    update-repos:
        name: Update Package Repositories
        needs: release
        # Only update repositories for stable releases — skip beta, rc, alpha, dev tags
        # so users with automatic updates don't receive pre-release packages.
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'RC') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'dev') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download debian amd64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: debian-package-amd64
                  path: debs/

            - name: Download debian arm64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: debian-package-arm64
                  path: debs/

            - name: Download rpm x86_64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: rpm-package-x86_64
                  path: rpms/
              continue-on-error: true

            - name: Download rpm aarch64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: rpm-package-aarch64
                  path: rpms/
              continue-on-error: true

            - name: Install repository tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y reprepro createrepo-c

            - name: Clone gh-pages branch
              run: |
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git config --global user.name "github-actions[bot]"
                  if ! git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages-repo 2>/dev/null; then
                    (
                      mkdir -p gh-pages-repo
                      cd gh-pages-repo
                      git init
                      git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
                      git checkout -b gh-pages
                    )
                  fi

            - name: Update APT repository
              run: |
                  mkdir -p gh-pages-repo/apt/conf
                  cat > gh-pages-repo/apt/conf/distributions <<'EOF'
                  Origin: Fidus Writer
                  Label: Fidus Writer
                  Suite: stable
                  Codename: stable
                  Version: 1.0
                  Architectures: amd64 arm64
                  Components: main
                  Description: Fidus Writer APT repository
                  EOF

                  # Remove old versions to keep the repo size under control.
                  # Only the latest version is kept in the apt repository.
                  echo "Removing old versions of fiduswriter-server..."
                  reprepro -b gh-pages-repo/apt remove stable fiduswriter-server || true
                  echo "Removing old versions of fiduswriter-server-nodejs..."
                  reprepro -b gh-pages-repo/apt remove stable fiduswriter-server-nodejs || true

                  for deb in debs/*.deb; do
                    echo "Adding $deb to APT repository..."
                    reprepro -b gh-pages-repo/apt includedeb stable "$deb"
                  done

                  # Regenerate the Release file with correct checksums.
                  # This works because the .deb files are now small enough to be hosted
                  # directly in the pool/ directory on gh-pages.
                  reprepro -b gh-pages-repo/apt export

            - name: Sign APT repository
              env:
                  APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
                  APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
              run: |
                  if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
                    echo "No APT_GPG_PRIVATE_KEY secret found, skipping GPG signing."
                    echo "To enable signing, add the private key as a repository secret."
                    exit 0
                  fi

                  export GNUPGHOME="$RUNNER_TEMP/gnupg-apt"
                  mkdir -p "$GNUPGHOME"
                  chmod 700 "$GNUPGHOME"

                  # Import the private key
                  echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --yes --pinentry-mode loopback --import

                  # Get the first signing key ID
                  KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
                  if [ -z "$KEY_ID" ]; then
                    echo "ERROR: Could not extract key ID from imported private key."
                    exit 1
                  fi
                  echo "Signing with key ID: $KEY_ID"

                  RELEASE="gh-pages-repo/apt/dists/stable/Release"

                  # Create detached signature (Release.gpg)
                  if [ -n "$APT_GPG_PASSPHRASE" ]; then
                    gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" \
                        --armor --detach-sign --output "${RELEASE}.gpg" --local-user "$KEY_ID" "$RELEASE"
                    # Create inline signed Release (InRelease)
                    gpg --batch --yes --pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE" \
                        --armor --clearsign --output "${RELEASE}.clear" --local-user "$KEY_ID" "$RELEASE"
                  else
                    gpg --batch --yes --pinentry-mode loopback \
                        --armor --detach-sign --output "${RELEASE}.gpg" --local-user "$KEY_ID" "$RELEASE"
                    gpg --batch --yes --pinentry-mode loopback \
                        --armor --clearsign --output "${RELEASE}.clear" --local-user "$KEY_ID" "$RELEASE"
                  fi

                  mv "${RELEASE}.clear" "gh-pages-repo/apt/dists/stable/InRelease"

                  # Export public key for users to download
                  gpg --armor --export "$KEY_ID" > "gh-pages-repo/apt/fiduswriter.asc"

                  echo "APT repository signed successfully."

            - name: Update YUM repository
              run: |
                  TAG="${{ github.ref_name }}"
                  REPO="${{ github.repository }}"
                  BASE_URL="https://github.com/${REPO}/releases/download/${TAG}/"

                  # Only create YUM repo if RPMs exist
                  if ls rpms/*.rpm >/dev/null 2>&1; then
                    mkdir -p /tmp/rpms
                    cp rpms/*.rpm /tmp/rpms/
                    mkdir -p gh-pages-repo/yum
                    echo "Generating YUM repository metadata..."
                    createrepo_c --baseurl "$BASE_URL" --outputdir gh-pages-repo/yum /tmp/rpms/
                    echo "YUM repo metadata generated."
                  else
                    echo "No RPM artifacts found, skipping YUM repo update."
                  fi

            - name: Create index page
              run: |
                  cat > gh-pages-repo/index.html <<'INDEXHTML'
                  <!DOCTYPE html>
                  <html>
                  <head><title>Fidus Writer Package Repositories</title></head>
                  <body>
                  <h1>Fidus Writer Package Repositories</h1>

                  <h2>APT Repository (Debian / Ubuntu / Linux Mint)</h2>
                  <p><strong>Traditional format (all versions):</strong></p>
                  <pre>
                  sudo curl -fsSL https://fiduswriter.github.io/fiduswriter/apt/fiduswriter.asc | sudo gpg --dearmor -o /usr/share/keyrings/fiduswriter.gpg
                  echo "deb [signed-by=/usr/share/keyrings/fiduswriter.gpg] https://fiduswriter.github.io/fiduswriter/apt stable main" | sudo tee /etc/apt/sources.list.d/fiduswriter.list
                  sudo apt-get update
                  sudo apt-get install fiduswriter-server
                  </pre>
                  <p><strong>Modern DEB822 format (Ubuntu 24.04+, Debian 13+, Mint 22+):</strong></p>
                  <pre>
                  sudo curl -fsSL https://fiduswriter.github.io/fiduswriter/apt/fiduswriter.asc | sudo gpg --dearmor -o /usr/share/keyrings/fiduswriter.gpg
                  sudo tee /etc/apt/sources.list.d/fiduswriter.sources &lt;&lt;'EOF'
                  Types: deb
                  URIs: https://fiduswriter.github.io/fiduswriter/apt
                  Suites: stable
                  Components: main
                  Signed-By: /usr/share/keyrings/fiduswriter.gpg
                  Architectures: amd64 arm64
                  EOF
                  sudo apt-get update
                  sudo apt-get install fiduswriter-server
                  </pre>

                  <h2>YUM Repository (RHEL / Rocky Linux / AlmaLinux / Fedora)</h2>
                  <pre>
                  sudo tee /etc/yum.repos.d/fiduswriter.repo &lt;&lt;'REPO'
                  [fiduswriter]
                  name=Fidus Writer
                  baseurl=https://fiduswriter.github.io/fiduswriter/yum
                  enabled=1
                  gpgcheck=0
                  REPO
                  sudo dnf makecache
                  sudo dnf install fiduswriter-server
                  </pre>
                  </body>
                  </html>
                  INDEXHTML

            - name: Push gh-pages branch
              working-directory: gh-pages-repo
              run: |
                  git add -A
                  if ! git diff --cached --quiet; then
                    git commit -m "Update package repositories for ${{ github.ref_name }}"
                    git push -u origin gh-pages --force
                  fi

    release:
        name: Create Release
        needs:
            - build-deb
            - build-rpm
            - build-pypi
            - build-docker
            - build-desktop-linux
            - build-desktop-macos
            - build-desktop-windows
        # Wait for all build jobs to finish (using always() so RPM failures
        # don't block the release), then create the release only on tags.
        # Manual workflow_dispatch from a branch skips release creation.
        if: always() && needs.build-deb.result == 'success' && needs.build-pypi.result == 'success' && needs.build-docker.result == 'success' && github.ref_type == 'tag'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Check out backend repository
              run: |
                  git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend 2>/dev/null \
                      || git clone --depth 1 "https://github.com/fiduswriter/fiduswriter-server-backend.git" fiduswriter-server-backend

            - name: Determine version
              id: version
              run: |
                  VERSION=$(tr -d '[:space:]' < fiduswriter-server-backend/fiduswriter/version.txt)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Download debian amd64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: debian-package-amd64
                  path: debian-build-amd64/

            - name: Download debian arm64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: debian-package-arm64
                  path: debian-build-arm64/

            - name: Download rpm x86_64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: rpm-package-x86_64
                  path: rpm-build-x86_64/
              continue-on-error: true

            - name: Download rpm aarch64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: rpm-package-aarch64
                  path: rpm-build-aarch64/
              continue-on-error: true

            - name: Download pypi artifact
              uses: actions/download-artifact@v8
              with:
                  name: pypi-package
                  path: pypi-dist/

            # Desktop artifacts are optional: they need platform runners and,
            # on macOS, signing credentials. A failure here must not block the
            # server release.
            - name: Download desktop linux x86_64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: desktop-linux-x86_64
                  path: desktop-build-linux-x86_64/
              continue-on-error: true

            - name: Download desktop linux aarch64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: desktop-linux-aarch64
                  path: desktop-build-linux-aarch64/
              continue-on-error: true

            - name: Download desktop macOS aarch64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: desktop-macos-aarch64
                  path: desktop-build-macos-aarch64/
              continue-on-error: true

            - name: Download desktop macOS x86_64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: desktop-macos-x86_64
                  path: desktop-build-macos-x86_64/
              continue-on-error: true

            - name: Download desktop windows artifact
              uses: actions/download-artifact@v8
              with:
                  name: desktop-windows-x64
                  path: desktop-build-windows-x64/
              continue-on-error: true

            - name: Collect release assets
              run: |
                  mkdir -p release-assets
                  cp debian-build-amd64/*.deb release-assets/ 2>/dev/null || true
                  cp debian-build-arm64/*.deb release-assets/ 2>/dev/null || true
                  cp rpm-build-x86_64/*.rpm release-assets/ 2>/dev/null || true
                  cp rpm-build-aarch64/*.rpm release-assets/ 2>/dev/null || true
                  cp desktop-build-linux-x86_64/*.AppImage release-assets/ 2>/dev/null || true
                  cp desktop-build-linux-x86_64/*.deb release-assets/ 2>/dev/null || true
                  cp desktop-build-linux-aarch64/*.AppImage release-assets/ 2>/dev/null || true
                  cp desktop-build-linux-aarch64/*.deb release-assets/ 2>/dev/null || true
                  cp desktop-build-macos-aarch64/*.dmg release-assets/ 2>/dev/null || true
                  cp desktop-build-macos-x86_64/*.dmg release-assets/ 2>/dev/null || true
                  cp desktop-build-windows-x64/*.exe release-assets/ 2>/dev/null || true
                  echo "Assets to upload:"
                  ls -la release-assets/

            - name: Upload release assets
              uses: softprops/action-gh-release@v3
              with:
                  files: release-assets/*
                  # Explicitly publish: if a draft release for the tag already
                  # exists, an update alone would leave it as a draft.
                  draft: false
                  # Mark pre-releases as such so they are clearly separated
                  # from stable releases.
                  prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'RC') || contains(github.ref_name, 'dev') }}
                  body: |
                      ## Fidus Writer ${{ steps.version.outputs.version }}

                      ### Docker Image

                      Multi-architecture Docker images (amd64, arm64) are available:

                      ```bash
                      docker pull ghcr.io/fiduswriter/fiduswriter:${{ steps.version.outputs.version }}
                      docker pull ghcr.io/fiduswriter/fiduswriter:latest
                      ```

                      ### PyPI

                      Install with pip:

                      ```bash
                      pip install fiduswriter==${{ steps.version.outputs.version }}
                      ```

                      ### APT Repository (Debian/Ubuntu/Linux Mint)

                      Add the repository and install:

                      ```bash
                      sudo curl -fsSL https://fiduswriter.github.io/fiduswriter/apt/fiduswriter.asc | sudo gpg --dearmor -o /usr/share/keyrings/fiduswriter.gpg
                      echo "deb [signed-by=/usr/share/keyrings/fiduswriter.gpg] https://fiduswriter.github.io/fiduswriter/apt stable main" | sudo tee /etc/apt/sources.list.d/fiduswriter.list
                      sudo apt-get update
                      sudo apt-get install fiduswriter-server
                      ```

                      ### RPM Packages

                      Download and install the RPM for your architecture from the assets below.

                      ### System Packages

                      - **Debian/Ubuntu**: `fiduswriter-server_*_amd64.deb` (or `*_arm64.deb`) plus `fiduswriter-server-nodejs_*_amd64.deb` on older distributions
                      - **RHEL/Rocky/AlmaLinux/Fedora**: `fiduswriter-server-*_x86_64.rpm` or `fiduswriter-server-*_aarch64.rpm`
